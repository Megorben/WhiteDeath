item.whitedeath-frost-round.name = Ледяной патрон
item.whitedeath-frost-round.description = Титановый патрон, обработанный криогенной жидкостью. Замораживает и замедляет цель при попадании.
block.whitedeath-frost-press.name = Ледяной пресс
block.whitedeath-frost-press.description = Прессует титан в ледяные патроны с помощью криогенной жидкости.
block.whitedeath-white-death.name = Белая смерть
block.whitedeath-white-death.description = Дальнобойная снайперская турель. Медленная, точная, смертоносная. Ледяные патроны замораживают цели.
